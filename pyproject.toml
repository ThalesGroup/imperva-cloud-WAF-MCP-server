[project]
name = "cwaf-external-mcp"
version = "1.0.23"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eilon.shai", email = "eilon.shai@imperva.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.0",
    "authlib>=1.7.1",
    "cryptography>=48.0.1",
    "pydantic<3.0,>=2.0",
    "ddtrace>=4.8.2,<5.0",
    "debugpy>=1.8.14",
    "fastapi>=0.115.14",
    "fastmcp>=3.2.0",
    "httpx>=0.28.1",
    "idna>=3.15",
    "logging>=0.4.9.6",
    "prometheus-client>=0.22.1",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-httpserver>=1.1.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "requests>=2.33.0",
    "respx>=0.22.0",
    "starlette>=1.0.1",
    "urllib3>=2.7.0",
    "uvicorn>=0.35.0",
    "werkzeug>=3.1.6",
]

[project.scripts]
cwaf-external-mcp = "cwaf_external_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src", "component"]
include = ["environment*","cwaf_external_mcp*"]

[dependency-groups]
dev = [
    "anyio>=4.9.0",
    "black>=26.3.1",
    "filelock>=3.20.3",
    "isort>=6.0.1",
    "jwcrypto>=1.5.7",
    "pre-commit>=4.5.1",
    "pyjwt>=2.13.0",
    "pylint>=3.3.7",
    "python-minifier>=3.1.1",
    "ruff>=0.14.10",
    "virtualenv>=20.36.1",
]

test = [
    "docker>=7.1.0",
    "testcontainers>=4.14.0",
    "wiremock>=2.7.0",
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.7.0",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.pylint."MASTER"]
ignore = ["tests"]

[tool.coverage.run]
omit = [
    "*/.tests/*"
    ]

